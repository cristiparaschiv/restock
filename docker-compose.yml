services:
  db:
    image: postgres:16-alpine
    container_name: restok-db
    environment:
      POSTGRES_USER: restok
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restok_secret}
      POSTGRES_DB: restok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restok -d restok"]
      interval: 5s
      timeout: 5s
      retries: 5

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: restok-translate
    environment:
      - LT_LOAD_ONLY=en,ro
      - LT_DISABLE_WEB_UI=false
    volumes:
      - lt_models:/home/libretranslate/.local
    ports:
      - "5050:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: restok-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://restok:${DB_PASSWORD:-restok_secret}@db:5432/restok
      - LIBRETRANSLATE_URL=http://libretranslate:5000
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production-please}
      - CORS_ORIGINS=["http://localhost:3000"]
      - DEBUG=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: restok-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  lt_models:
  backend_uploads:
